<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axiom Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: {
              50: '#f1f5f9',
              100: '#e2e8f0',
              200: '#cbd5e1',
              300: '#94a3b8',
              400: '#64748b',
              500: '#475569',
              600: '#334155',
              700: '#1e293b',
              800: '#0f172a',
              900: '#080f1d',
              950: '#040a12',
            },
            primary: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
            },
            cyan: {
              300: '#67e8f9',
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
            },
            danger: {
              400: '#f87171',
              500: '#ef4444',
              600: '#dc2626',
            },
            warn: {
              400: '#fbbf24',
              500: '#f59e0b',
            },
            success: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          fontSize: {
            'xs': ['13px', { lineHeight: '1.5' }],
          },
          animation: {
            'fade-in': 'fadeIn 0.15s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
          },
          boxShadow: {
            'card': '0 1px 3px rgba(0,0,0,0.3)',
          }
        }
      },
      darkMode: 'class'
    }
  </script>
  <style>
    body {
      background-color: #080f1d;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #080f1d;
    }

    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    .scrollbar-purple::-webkit-scrollbar {
      width: 4px;
    }

    .scrollbar-purple::-webkit-scrollbar-track {
      background: transparent;
    }

    .scrollbar-purple::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.4);
      border-radius: 4px;
    }

    .scrollbar-purple::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.7);
    }

    .sidebar-glow {
      background: #0f172a;
    }

    .card-hover {
      transition: border-color 0.15s;
    }

    .card-hover:hover {
      border-color: rgba(139, 92, 246, 0.3);
    }

    .stat-card-target {
      border-left-color: #8b5cf6;
    }

    .stat-card-sub {
      border-left-color: #06b6d4;
    }

    .stat-card-port {
      border-left-color: #3b82f6;
    }

    .stat-card-vuln {
      border-left-color: #ef4444;
    }

    .stat-card-critical {
      border-left-color: #f97316;
    }

    .stat-card-scan {
      border-left-color: #10b981;
    }

    .stat-card-fleet {
      border-left-color: #a78bfa;
    }

    .nav-active {
      background: rgba(139, 92, 246, 0.12);
      border-left: 2px solid #8b5cf6;
    }

    .badge-running {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-completed {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-failed {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .badge-pending {
      background: rgba(148, 163, 184, 0.12);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .severity-critical {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border-left: 3px solid #ef4444;
    }

    .severity-high {
      background: rgba(249, 115, 22, 0.12);
      color: #fb923c;
      border-left: 3px solid #f97316;
    }

    .severity-medium {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border-left: 3px solid #f59e0b;
    }

    .severity-low {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border-left: 3px solid #10b981;
    }

    .severity-info {
      background: rgba(6, 182, 212, 0.12);
      color: #22d3ee;
      border-left: 3px solid #06b6d4;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "d3": "https://aistudiocdn.com/d3@^7.9.0",
    "topojson-client": "https://aistudiocdn.com/topojson-client@^3.1.0"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
